name: Engine watch

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  watch:
    name: Check runtime fingerprint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node == 'nightly' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26, nightly]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - id: runtime
        run: |
          echo "version=$(node -p 'process.version')" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(node -p 'process.version + "-" + process.versions.v8 + "-" + process.versions.uv + "-" + process.arch + "-" + process.platform')" >> "$GITHUB_OUTPUT"
      - id: fingerprint-cache
        uses: actions/cache/restore@v4
        with:
          path: perf/engine-watch/${{ matrix.node }}.json
          key: engine-watch-${{ runner.os }}-${{ matrix.node }}-${{ steps.runtime.outputs.fingerprint }}
          restore-keys: engine-watch-${{ runner.os }}-${{ matrix.node }}-
      - run: pnpm install --frozen-lockfile
        if: steps.fingerprint-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm perf:engines
        if: steps.fingerprint-cache.outputs.cache-hit != 'true'
      - run: pnpm perf:assumptions
        if: steps.fingerprint-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm perf:strategies --smoke
        if: steps.fingerprint-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm perf:codegen
        if: steps.fingerprint-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm perf:critical
        if: steps.fingerprint-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm perf:report
        if: steps.fingerprint-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: mkdir -p perf/engine-watch && node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({node:process.version,v8:process.versions.v8,uv:process.versions.uv,arch:process.arch,platform:process.platform,cpu:require("node:os").cpus()[0]?.model ?? null}, null, 2)+"\n")' "perf/engine-watch/${{ matrix.node }}.json"
        if: steps.fingerprint-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/cache/save@v4
        if: steps.fingerprint-cache.outputs.cache-hit != 'true'
        with:
          path: perf/engine-watch/${{ matrix.node }}.json
        key: engine-watch-${{ runner.os }}-${{ matrix.node }}-${{ steps.runtime.outputs.fingerprint }}
      - uses: actions/upload-artifact@v6
        if: always() && steps.fingerprint-cache.outputs.cache-hit != 'true'
        with:
          name: engine-watch-node-${{ matrix.node }}
          path: perf/results/perf-report.*
