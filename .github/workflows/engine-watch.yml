name: Engine watch

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

concurrency:
  group: engine-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    name: Compare compiler assumptions (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26, nightly]
    continue-on-error: ${{ matrix.node == 'nightly' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf:engines
      - run: pnpm perf:assumptions
      - run: pnpm perf:critical
      - run: pnpm perf:baseline:check
