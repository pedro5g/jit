name: Optimizer conformance

on:
  pull_request:
  push:
    branches: [main, feat/reconstructive-artifacts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Semantic and AOT conformance (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm optimizer:conformance
      - run: pnpm optimizer:determinism
      - run: pnpm exec tsc --noEmit
