name: Release performance envelope

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-envelope:
    name: Release envelope (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm optimizer:conformance
      - run: pnpm perf:assumptions
      - run: pnpm perf:codegen
      - run: pnpm perf:critical
      - run: pnpm perf:baseline:check
      - run: pnpm perf:report
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-perf-report-node-${{ matrix.node }}
          path: perf/results/perf-report.*
