name: Critical performance checks

on:
  pull_request:
    paths:
      - "packages/jit/src/compiler/**"
      - "packages/jit/src/runtime/**"
      - "packages/jit/src/core/**"
      - "packages/jit/src/factories/**"
      - "perf/**"
      - ".github/workflows/perf-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf:assumptions
      - run: pnpm perf:codegen
      - run: pnpm perf:critical
      - run: pnpm perf:baseline:check
      - run: pnpm perf:report
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-report-node-26
          path: perf/results/perf-report.*
