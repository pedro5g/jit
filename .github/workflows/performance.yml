name: Compiler performance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  critical:
    name: Critical compiler assumptions (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf:assumptions
      - run: pnpm perf:critical
      - run: pnpm perf:baseline:check
