name: Nightly performance measurements

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  critical:
    name: Critical compiler assumptions (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf:engines
      - run: pnpm perf:assumptions
      - run: pnpm perf:codegen
      - run: pnpm perf:critical
      - run: pnpm perf:strategies --smoke
      - run: pnpm perf:baseline:check
      - run: pnpm perf:report
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-report-node-${{ matrix.node }}
          path: perf/results/perf-report.*

  nightly-runtime:
    name: Informational Node nightly
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: nightly
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf:assumptions
      - run: pnpm perf:critical
      - run: pnpm perf:strategies --smoke
      - run: pnpm perf:report
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-report-node-nightly
          path: perf/results/perf-report.*
